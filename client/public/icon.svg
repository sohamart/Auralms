<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="aura-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="prism-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4338CA" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#aura-grad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  
  <!-- Native App Emblem / Layered Prisms -->
  <g transform="translate(106, 106)" filter="url(#shadow)">
    <!-- Top Prism Diamond -->
    <polygon points="150,20 270,90 150,160 30,90" fill="url(#prism-grad)"/>
    
    <!-- Middle Shelf -->
    <polygon points="30,140 150,210 270,140 270,180 150,250 30,180" fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- Base Shelf -->
    <polygon points="30,230 150,300 270,230 270,270 150,340 30,270" fill="#E0E7FF" fill-opacity="0.8"/>
  </g>
</svg>
